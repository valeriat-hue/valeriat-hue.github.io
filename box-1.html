<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Box 1 - 360° View</title>

    <!-- Your existing website stylesheet -->


    <!-- Pannellum CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"
    >

    <!-- Pannellum JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

    <!-- Styles for this page's viewer -->
    <style>
         html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

    #panorama {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>

<body>

  <div id="panorama"></div>

    <!-- Initialize Pannellum -->
    <script>
        pannellum.viewer('panorama', {
            type: 'equirectangular',
            panorama: 'img/panorama.jpg',
            autoLoad: true
        });

</body>
</html>
