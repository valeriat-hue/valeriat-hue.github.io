<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Box 1 - 360° View</title>

    <!-- Your existing website stylesheet -->
    <link rel="stylesheet" href="css/templatemo-style.css">

    <!-- Pannellum CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"
    >

    <!-- Pannellum JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

    <!-- Styles for this page's viewer -->
    <style>
       html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #panorama {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

   
    </style>
</head>

<body>

    <div class="page-content">
        <h1>Box 1 - 360° Panorama</h1>

        <p>Explore this space by clicking and dragging the image.</p>

        <!-- The panorama appears here -->
        <div id="panorama"></div>

        <p><a href="index.html">← Back to main page</a></p>
    </div>

    <!-- Initialize Pannellum -->
    <script>
        pannellum.viewer('panorama', {
            type: 'equirectangular',
            panorama: 'img/panorama.jpg',
            autoLoad: true
        });
    </script>

</body>
</html>
